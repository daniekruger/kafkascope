[pytest]
testpaths = tests
python_files = test_*.py
markers =
    integration: tests that need a live Kafka broker (skipped if unreachable)
    smoke: browser tests that need a running app + Playwright (run via ./run-smoke.sh)
# Smoke tests need a browser and a running app, so they're out of the default run.
addopts = -q -m "not smoke"
