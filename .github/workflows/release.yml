name: release

# Build and push a multi-arch image to Docker Hub when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME  — daniekruger
#   DOCKERHUB_TOKEN     — a Docker Hub access token (Account Settings → Security)
on:
  push:
    tags: ["v*"]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: daniekruger/kafkascope
          # v1.2.3 -> tags 1.2.3, 1.2, 1, and latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Mirror README.md to the Docker Hub repository overview so both pages match.
      # If this step 403s, Docker Hub's description API rejected the access token —
      # add your account password as a secret and use it here instead of the token.
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: daniekruger/kafkascope
          short-description: "Web UI to inspect and operate Apache Kafka"
          readme-filepath: ./README.md
