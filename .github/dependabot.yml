version: 2
updates:
  # Python dependencies (requirements.txt, requirements-dev.txt, requirements-smoke.txt)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch bumps instead of a flood of separate PRs.
      python-minor:
        update-types: ["minor", "patch"]

  # Dockerfile base image (python:3.12-slim)
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  # GitHub Actions used in ci.yml / release.yml
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: ["minor", "patch"]
